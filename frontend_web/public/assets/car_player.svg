<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="96" viewBox="0 0 48 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Player Car">
  <defs>
    <linearGradient id="cp" x1="0" y1="0" x2="48" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <rect x="6" y="6" width="36" height="84" rx="10" fill="url(#cp)" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
  <!-- cockpit -->
  <rect x="12" y="22" width="24" height="24" rx="6" fill="rgba(255,255,255,0.75)"/>
  <!-- stripes -->
  <rect x="22" y="8" width="4" height="80" fill="#93C5FD"/>
  <!-- wheels -->
  <rect x="2" y="20" width="6" height="16" rx="2" fill="#111827"/>
  <rect x="2" y="60" width="6" height="16" rx="2" fill="#111827"/>
  <rect x="40" y="20" width="6" height="16" rx="2" fill="#111827"/>
  <rect x="40" y="60" width="6" height="16" rx="2" fill="#111827"/>
</svg>
