<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Track Pattern">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M0 0H40M0 20H40M0 0V40M20 0V40" stroke="#2563EB" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <radialGradient id="shade" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  <rect width="400" height="400" fill="url(#shade)"/>
  <g stroke="#F59E0B" stroke-opacity="0.25" fill="none">
    <circle cx="200" cy="200" r="120" stroke-width="4"/>
    <circle cx="200" cy="200" r="160" stroke-width="2"/>
  </g>
