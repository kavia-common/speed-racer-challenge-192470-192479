<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Track Pattern">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(17,24,39,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(37,99,235,0.10)"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f9fafb" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#fade)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.35"/>
  <!-- subtle chevrons -->
  <g opacity="0.15" fill="#2563EB">
    <path d="M40 100 l30 -30 l30 30 l-30 30 z"/>
    <path d="M140 200 l30 -30 l30 30 l-30 30 z"/>
    <path d="M240 300 l30 -30 l30 30 l-30 30 z"/>
  </g>
</svg>
